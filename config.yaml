# Configuración del equipo automatizado GTA 6
channel:
  name: "Mi canal GTA 6"
  language: "es"            # idioma de guiones, títulos y voz
  audience: "jugadores hispanohablantes de 16-34 años que siguen GTA 6"
  tone: "enérgico, cercano, con datos verificados y sin clickbait engañoso"
  niche_pillars:            # temas fijos del canal
    - noticias y actualizaciones de GTA 6
    - secretos, easter eggs y detalles ocultos de Leonida / Vice City
    - guías y trucos (dinero, coches, misiones)
    - teorías y análisis de la historia de Lucia y Jason
    - comparativas (GTA 6 vs GTA 5, tráileres vs juego final)

claude:
  model: "claude-opus-5-5"
  effort: "high"            # low | medium | high | xhigh | max
  use_fallbacks: true       # reintento automático en otro modelo si hay un rechazo

formats:
  short:                    # YouTube Shorts
    aspect: "9:16"
    width: 1080
    height: 1920
    target_seconds: 50
    scenes: 6
  long:                     # vídeo horizontal
    aspect: "16:9"
    width: 1920
    height: 1080
    target_seconds: 480
    scenes: 14

voice:
  provider: "elevenlabs"    # elevenlabs | silent (silent = audio mudo para pruebas)
  model_id: "eleven_multilingual_v2"

visuals:
  # Orden de preferencia para cada escena:
  #  1) clip IA ya generado en assets/ai_clips/<run_id>/scene_XX.mp4 (p.ej. desde Higgsfield)
  #  2) tu propio gameplay en assets/footage/ (recomendado: es lo más seguro a nivel de derechos)
  #  3) tarjeta de título generada automáticamente
  footage_dir: "assets/footage"
  ai_clips_dir: "assets/ai_clips"
  music_dir: "assets/music"
  music_volume: 0.12
  burn_subtitles: true

publishing:
  enabled: false            # pon true cuando quieras que suba a YouTube
  privacy: "private"        # private | unlisted | public
  schedule_hours_ahead: 0   # >0 programa la publicación (requiere privacy private)
  require_approval: true    # si true, sube en privado y espera tu "approve"
  category_id: "20"         # 20 = Gaming
  contains_synthetic_media: true   # declaración obligatoria de YouTube si usas IA realista
